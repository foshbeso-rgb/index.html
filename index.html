<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinai Smart Concierge - v49</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --accent-color: #319795;
            --bg-color: #f7fafc;
            --text-color: #2d3748;
            --white: #ffffff;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--white);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 5px;
        }

        header p {
            color: #718096;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-color);
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn-container {
            text-align: center;
            margin-top: 30px;
        }

        button {
            background-color: var(--accent-color);
            color: var(--white);
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #285e61;
        }

        .services-section {
            margin-top: 25px;
            background: #edf2f7;
            padding: 20px;
            border-radius: var(--border-radius);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Sinai Smart Concierge</h1>
            <p>النظام الذكي للخدمات الفندقية واللوجستية - الإصدار 49</p>
        </header>

        <form id="conciergeForm">
            <!-- حقل اسم الضيف -->
            <div class="form-group">
                <label for="guestName">اسم الضيف الكريم:</label>
                <input type="text" id="guestName" name="guestName" placeholder="أدخل اسمك الكامل..." required>
            </div>

            <!-- حقل رقم الغرفة -->
            <div class="form-group">
                <label for="roomNumber">رقم الغرفة أو الوحدة:</label>
                <input type="text" id="roomNumber" name="roomNumber" placeholder="مثال: 304" required>
            </div>

            <!-- قسم الخدمات المباشرة -->
            <div class="services-section">
                <div class="form-group">
                    <label for="serviceType">اختر نوع الخدمة المطلوبة:</label>
                    <select id="serviceType" name="serviceType">
                        <option value="room_service">خدمة الغرف (الطعام والشراب)</option>
                        <option value="housekeeping">تنظيف وصيانة الغرفة</option>
                        <option value="transportation">حجز مواصلات / رحلات</option>
                        <option value="inquiry">استعلامات عامة</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="serviceNotes">ملاحظات إضافية:</label>
                    <textarea id="serviceNotes" name="serviceNotes" rows="4" placeholder="اكتب تفاصيل طلبك هنا..."></textarea>
                </div>
            </div>

            <!-- زر الإرسال -->
            <div class="btn-container">
                <button type="submit">إرسال الطلب</button>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('conciergeForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const guestName = document.getElementById('guestName').value;
            const roomNumber = document.getElementById('roomNumber').value;
            
            if(!guestName || !roomNumber) {
                alert('يرجى تعبئة الحقول الأساسية (الاسم ورقم الغرفة).');
                return;
            }

            alert(`شكراً لك يا ${guestName}! تم إرسال طلبك الخاص بغرفة رقم ${roomNumber} بنجاح، وستم التواصل معك فوراً.`);
            this.reset();
        });
    </script>

</body>
</html>
